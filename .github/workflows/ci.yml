name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        working-directory: backend
        run: uv sync --group dev --frozen
      - name: Роль для миграций
        working-directory: backend
        run: >
          uv run python -c "import os, psycopg; user=os.popen('whoami').read().strip();
          conn=psycopg.connect('postgresql://postgres@127.0.0.1:5433/postgres', autocommit=True);
          conn.execute('CREATE ROLE %s WITH LOGIN SUPERUSER' % psycopg.sql.Identifier(user).as_string(conn))"
      - name: Ruff
        working-directory: backend
        run: uv run ruff check app tests schema_sql.py alembic
      - name: Mypy
        working-directory: backend
        run: uv run mypy app
      - name: Pytest
        working-directory: backend
        run: uv run pytest
        env:
          TEST_PG_PORT: "5433"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Зависимости и проверки
        working-directory: frontend
        run: npm ci && npm test && npm run build
