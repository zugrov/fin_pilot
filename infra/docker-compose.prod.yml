services:
  proxy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  frontend:
    image: finpilot-frontend:0.2.0
    restart: unless-stopped

  api:
    image: finpilot-api:0.2.0
    env_file:
      - ../.env
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    image: finpilot-api:0.2.0
    env_file:
      - ../.env
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "worker",
        "--loglevel=info",
      ]
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  beat:
    image: finpilot-api:0.2.0
    env_file:
      - ../.env
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "beat",
        "--loglevel=info",
      ]
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: finpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
