services:
  proxy:
    image: caddy:2.8.4-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - frontend

  frontend:
    build:
      context: ../frontend
    image: finpilot-frontend:dev

  api:
    build:
      context: ../backend
    image: finpilot-api:dev
    env_file:
      - ../.env
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../backend
    image: finpilot-api:dev
    env_file:
      - ../.env
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "worker",
        "--loglevel=info",
      ]
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ../backend
    image: finpilot-api:dev
    env_file:
      - ../.env
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "beat",
        "--loglevel=info",
      ]
    depends_on:
      - redis

  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: finpilot
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-alpine

volumes:
  pgdata:
