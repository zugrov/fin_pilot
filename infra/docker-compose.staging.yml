name: finpilot-staging

services:
  proxy:
    image: caddy:2.8.4-alpine
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    image: finpilot-frontend:staging
    restart: unless-stopped

  api:
    build:
      context: ../backend
    image: finpilot-api:staging
    env_file:
      - ../.env
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - imports:/app/var/imports
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ../backend
    image: finpilot-api:staging
    env_file:
      - ../.env
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "worker",
        "--loglevel=info",
      ]
    volumes:
      - imports:/app/var/imports
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  beat:
    build:
      context: ../backend
    image: finpilot-api:staging
    env_file:
      - ../.env
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "beat",
        "--loglevel=info",
      ]
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: finpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  imports:
