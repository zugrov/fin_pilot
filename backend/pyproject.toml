[project]
name = "finpilot"
version = "0.2.0"
description = "Финансовый автопилот"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "celery>=5.4",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.12",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "sqlalchemy>=2.0.36",
  "tzdata>=2024.2",
  "uvicorn>=0.32",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
  # FA-R03.2c: чтение .xls (карточка 51, ОСВ). Только dev, не в production-образ.
  "xlrd==2.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Depends() в аргументах FastAPI — штатный паттерн, не изменяемый default.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/integration/conftest.py" = ["E402"]
"tests/synthetic_polygon/profiles.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "manual: ручная проверка на локальных образцах клиента (var/fa-r03-client-samples), не в CI",
]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false
